<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Romantic Button</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    
    /* Gradient Background */
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
}

/* Background animation */
@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Hide checkbox */
#toggle {
    display: none;
}

.btn {
    padding: 25px 50px;
    font-size: 26px;
    color: black;
    border-radius: 15px;
    cursor: pointer;
    text-align: center;
    max-width: 500px;
    
    /* Glass effect */
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    
    /* Glow */
    box-shadow: 0 0 20px rgba(255, 77, 109, 0.6);
    
    transition: 0.4s;
}

.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(255, 77, 109, 0.9);
}

/* Default text */
.btn::after {
    content: "Click Me ";
}

/* After click */
#toggle:checked + .btn::after {
    content: "You are the kind of beautiful that makes poets go silent because words aren't enough to describe the way the sunlight hits your hair";
    font-size: 20px;
}
</style>

</head>
<body>

<input type="checkbox" id="toggle">
<label for="toggle" class="btn"></label>

</body>
</html>
